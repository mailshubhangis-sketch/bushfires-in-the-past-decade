<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-label="Magazine-style world map highlighting major bushfire regions">
  <defs>
    <linearGradient id="landGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d4a73"/>
      <stop offset="100%" stop-color="#1a2d46"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="900" height="560" fill="#0f1d2f"/>

